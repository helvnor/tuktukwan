name: Test & push to staging

on:
  push:
    branches:
      - main

jobs:
  security:
    uses: ./.github/workflows/security.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v7
      - name: 🛠️ Setup pnpm
        uses: pnpm/action-setup@v6
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: 🧪 Run Vitest Unit Tests
        run: pnpm test

  deploy:
    needs:
      - security
      - test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v7

      - name: 🔑 GitHub Container Registry login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔧 Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ secrets.IMAGE_NAME }}:staging-${{ github.run_number }}
            ${{ secrets.IMAGE_NAME }}:staging

      - name: 🛡️ Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.IMAGE_NAME }}:staging
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: 📤 Push image
        run: |
          docker push ${{ secrets.IMAGE_NAME }}:staging-${{ github.run_number }}
          docker push ${{ secrets.IMAGE_NAME }}:staging
