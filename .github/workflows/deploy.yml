name: Push to latest

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 🔑 GitHub Container Registry login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Retag :staging to :latest
        run: |
          docker pull ${{ secrets.IMAGE_NAME }}:staging
          docker tag ${{ secrets.IMAGE_NAME }}:staging ${{ secrets.IMAGE_NAME }}:latest-${{ github.run_number }}
          docker tag ${{ secrets.IMAGE_NAME }}:staging ${{ secrets.IMAGE_NAME }}:latest
          docker push ${{ secrets.IMAGE_NAME }} --all-tags
